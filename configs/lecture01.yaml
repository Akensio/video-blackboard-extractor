# Per-video config for the WIS physics lecture-hall camera (fixed framing, shared
# by all four lectures). ROIs are FULL-RESOLUTION (1920x1080) board-panel polygons.
# These were measured from output/<video>/reference_plate.png; adjust if needed.
# (`vbe boards-roi --autodetect` only seeds rough boxes - these are hand-cleaned.)

# Use YOLO person segmentation for clean lecturer removal (requires the [seg]
# extra). Falls back to the median heuristic automatically if unavailable.
person_removal: gated_median

rois:
  - name: left
    polygon: [[20, 195], [590, 195], [590, 615], [20, 615]]
  - name: center_upper
    polygon: [[610, 150], [945, 150], [945, 400], [610, 400]]
  - name: center_lower
    polygon: [[610, 400], [945, 400], [945, 615], [610, 615]]
  - name: right
    polygon: [[1005, 195], [1440, 195], [1440, 615], [1005, 615]]
