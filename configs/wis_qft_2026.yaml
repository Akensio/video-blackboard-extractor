# Shared config for ALL FOUR 2026 QFT lectures (same hall, same fixed camera).
# Pass this file via --config for any of the videos in gitignore/.
#
# These 3 ROIs are ANALYSIS ZONES, not the output unit: the wall has three
# columns (left / center / right) separated by wooden pillars, each holding
# vertically-sliding boards. We watch each column for "a board got finished",
# then export the SINGLE board the fresh chalk is on, cropped rail-to-rail at
# that moment - so sliding never matters and every image is one board.
#
# Coordinates are FULL-RESOLUTION (1920x1080), covering each column's full
# board height (top frame to bottom rail).
person_removal: gated_median

rois:
  - name: left
    polygon: [[28, 250], [575, 250], [575, 822], [28, 822]]
  - name: center
    polygon: [[668, 250], [1250, 250], [1250, 822], [668, 822]]
  - name: right
    polygon: [[1345, 250], [1910, 250], [1910, 822], [1345, 822]]
